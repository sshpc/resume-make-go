<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>简历工坊</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="logo">简</span>
      <div class="brand-txt">
        <strong>简历工坊</strong>
        <small>本地运行 · 数据不出本机</small>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn" data-act="import-json" title="导入之前导出的 .json 简历">导入</button>
      <button class="btn" data-act="export-json" title="把当前简历另存为 .json">导出 JSON</button>
      <button class="btn" data-act="save" title="保存到本机（Ctrl+S）">保存<kbd>Ctrl+S</kbd></button>
      <button class="btn strong" data-act="export-png" title="把预览整页渲染成 PNG 图片">保存图片</button>
      <button class="btn strong" data-act="export-pdf" title="调用浏览器打印，选择“另存为 PDF”">导出 PDF</button>
      <button class="btn ghost" data-act="quit" title="关闭本地服务并退出">退出</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="editor" id="editor"></aside>

    <section class="stage">
      <div class="stage-bar">
        <div class="group" id="templateGroup"></div>
        <div class="group" id="themeGroup"></div>
        <div class="group zoom-group">
          <span class="lbl">缩放</span>
          <button class="mini" data-act="zoom-out" title="缩小">−</button>
          <span class="zoom-val" id="zoomVal">100%</span>
          <button class="mini" data-act="zoom-in" title="放大">＋</button>
          <button class="mini" data-act="zoom-fit" title="适应窗口">适应</button>
        </div>
      </div>
      <div class="stage-scroll" id="stageScroll">
        <div class="paper-wrap" id="paperWrap">
          <div class="page" id="page"></div>
          <div class="pg-guides" id="pgGuides" aria-hidden="true"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="statusbar">
    <span id="saveState">正在加载…</span>
    <span class="dot">·</span>
    <span id="exportPath">导出目录：—</span>
    <span class="grow"></span>
    <span id="verTag"></span>
  </footer>
</div>

<div class="toast" id="toast"></div>
<div class="loading" id="loading"><div class="spin"></div><span>正在导出…</span></div>

<input type="file" id="fileAvatar" accept="image/*" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<script>window.__RESUME_TOKEN__ = "{{TOKEN}}";</script>
<script src="/vendor/html2canvas.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
