name: CI

# 每次推送到 main 或提 PR 时，在三个平台上做一次编译检查，
# 保证代码在 Windows / Linux / macOS 上都能编过。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: false

      - name: go vet
        run: go vet ./...

      - name: go build
        shell: bash
        run: |
          set -euo pipefail
          go build -trimpath -ldflags "-s -w" -o "${{ runner.temp }}/resume-tool-check" .
          ls -l "${{ runner.temp }}/resume-tool-check"*

      - name: gofmt check
        shell: bash
        run: |
          set -euo pipefail
          out="$(gofmt -l . || true)"
          if [ -n "$out" ]; then
            echo "以下文件未通过 gofmt，请运行 gofmt -w ."
            echo "$out"
            exit 1
          fi
